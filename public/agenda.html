<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Estudio Jurídico</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="./css/clientes.css">
    <link rel="stylesheet" href="./css/agenda.css">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script src="./js/theme.js"></script>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
</head>

<body>

    <nav class="navbar">
        <div class="navbar-header">
            <h2>Estudio Jurídico</h2>
            <button id="menuToggle" class="menu-toggle"><span class="material-symbols-outlined">menu</span></button>
        </div>
        <ul id="navMenu">
            <li><a href="dashboard.html"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;margin-right:6px;">dashboard</span>Dashboard</a></li>
            <li><a href="clientes.html"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;margin-right:6px;">group</span>Clientes</a></li>
            <li><a href="agenda.html" class="active"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;margin-right:6px;">calendar_month</span>Agenda</a></li>
            <li><a href="expedientes.html"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;margin-right:6px;">folder_open</span>Expedientes</a></li>
            <li style="margin-top: 20px;"><a href="#" onclick="cerrarSesion()" style="color: #ef4444;"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;margin-right:6px;">logout</span>Cerrar Sesión</a>
            </li>
        </ul>
    </nav>

    <main class="container">
        <header class="section-header">
            <h1>Agenda de Turnos</h1>
            <div class="actions">
                <button id="btnNuevoTurno" class="btn-primary">+ Nuevo Turno</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn activo" onclick="cambiarTabAgenda('calendario', this)">Calendario</button>
            <button class="tab-btn" onclick="cambiarTabAgenda('lista', this)">Lista de turnos</button>
        </div>

        <!-- Filtros comunes (afectan calendario y lista) + leyenda de colores -->
        <div class="agenda-filtros">
            <div class="filtro-campo">
                <label for="filtroCliente">Cliente</label>
                <select id="filtroCliente"><option value="">Todos</option></select>
            </div>
            <div class="filtro-campo">
                <label for="filtroTipo">Tipo de evento</label>
                <select id="filtroTipo">
                    <option value="">Todos</option>
                    <option value="Audiencia">Audiencia</option>
                    <option value="Mediación">Mediación</option>
                    <option value="Presentar Escrito">Presentar Escrito</option>
                    <option value="Reunión Cliente">Reunión Cliente</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div id="leyendaEventos" class="leyenda-eventos"></div>
        </div>

        <!-- AQUÍ NACE EL CALENDARIO -->
        <section class="agenda-container tab-panel activo" id="tab-calendario">
            <div id="calendar"></div>
        </section>

        <!-- LISTA COMPLETA DE TURNOS (ver detalle y cambiar estado) -->
        <section class="agenda-container tab-panel" id="tab-lista">
            <div class="estado-chips" id="estadoChips">
                <button type="button" class="chip activo" data-estado="pendientes">Pendientes</button>
                <button type="button" class="chip" data-estado="vencidos">Vencidos</button>
                <button type="button" class="chip" data-estado="completado">Completados</button>
                <button type="button" class="chip" data-estado="cancelado">Cancelados</button>
                <button type="button" class="chip" data-estado="todos">Todos</button>
            </div>
            <ul class="lista-turnos" id="contenedorLista">
                <li style="text-align: center; color: #64748b; padding: 20px;">Cargando turnos...</li>
            </ul>
        </section>
    </main>

    <!-- Modal: NUEVO TURNO -->
    <div id="modalNuevoTurno" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Agendar Turno</h2>
                <button class="btn-close" id="btnCerrarModalTurno">&times;</button>
            </header>
            <form id="formNuevoTurno" class="modal-form">
                <div class="form-group">
                    <label for="clienteId">Cliente (Opcional)</label>
                    <select id="clienteId">
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="causaId">Expediente / Causa (Opcional)</label>
                    <select id="causaId" disabled>
                        <option value="">Elegí primero un cliente...</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha">Fecha *</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="hora">Hora *</label>
                        <input type="time" id="hora" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tipoEvento">Tipo de Evento *</label>
                    <select id="tipoEvento" required
                        onchange="document.getElementById('tipoEventoOtro').style.display = this.value === 'Otro' ? 'block' : 'none';">
                        <option value="">Seleccionar...</option>
                        <option value="Audiencia">Audiencia</option>
                        <option value="Mediación">Mediación</option>
                        <option value="Presentar Escrito">Presentar Escrito</option>
                        <option value="Reunión Cliente">Reunión Cliente</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <input type="text" id="tipoEventoOtro" style="display:none; margin-top:10px;"
                        placeholder="Especifique el evento...">
                </div>
                <div class="form-group">
                    <label for="recordatorio">Recordatorio por email</label>
                    <select id="recordatorio">
                        <option value="0">Sin recordatorio</option>
                        <option value="60">1 hora antes</option>
                        <option value="180">3 horas antes</option>
                        <option value="1440" selected>1 día antes</option>
                        <option value="2880">2 días antes</option>
                    </select>
                </div>
                <footer class="modal-actions">
                    <button type="button" class="btn-secondary" id="btnCancelarModalTurno">Cancelar</button>
                    <button type="submit" class="btn-primary">Agendar</button>
                </footer>
            </form>
        </div>
    </div>

    <!-- Modal: EDITAR TURNO -->
    <div id="modalEditarTurno" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Editar Turno</h2>
                <button class="btn-close" id="btnCerrarModalEditar">&times;</button>
            </header>
            <form id="formEditarTurno" class="modal-form">
                <input type="hidden" id="editarTurnoId">
                <div class="form-group">
                    <label for="editarClienteId">Cliente (Opcional)</label>
                    <select id="editarClienteId">
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editarCausaId">Expediente / Causa (Opcional)</label>
                    <select id="editarCausaId" disabled>
                        <option value="">Elegí primero un cliente...</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editarFecha">Fecha *</label>
                        <input type="date" id="editarFecha" required>
                    </div>
                    <div class="form-group">
                        <label for="editarHora">Hora *</label>
                        <input type="time" id="editarHora" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editarTipoEvento">Tipo de Evento *</label>
                    <select id="editarTipoEvento" required
                        onchange="document.getElementById('editarTipoEventoOtro').style.display = this.value === 'Otro' ? 'block' : 'none';">
                        <option value="">Seleccionar...</option>
                        <option value="Audiencia">Audiencia</option>
                        <option value="Mediación">Mediación</option>
                        <option value="Presentar Escrito">Presentar Escrito</option>
                        <option value="Reunión Cliente">Reunión Cliente</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <input type="text" id="editarTipoEventoOtro" style="display:none; margin-top:10px;"
                        placeholder="Especifique el evento...">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editarRecordatorio">Recordatorio por email</label>
                        <select id="editarRecordatorio">
                            <option value="0">Sin recordatorio</option>
                            <option value="60">1 hora antes</option>
                            <option value="180">3 horas antes</option>
                            <option value="1440">1 día antes</option>
                            <option value="2880">2 días antes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editarEstado">Estado</label>
                        <select id="editarEstado">
                            <option value="pendiente">Pendiente</option>
                            <option value="completado">Completado</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>
                <footer class="modal-actions">
                    <button type="button" class="btn-secondary" id="btnCancelarModalEditar">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                </footer>
            </form>
        </div>
    </div>

    <!-- Modal: DETALLE DE TURNO -->
    <div id="modalDetalleTurno" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Detalle del turno</h2>
                <button class="btn-close" id="btnCerrarModalDetalle">&times;</button>
            </header>
            <div class="detalle-turno" id="detalleTurnoBody"></div>
            <footer class="modal-actions" id="detalleTurnoAcciones"></footer>
        </div>
    </div>

    <!-- CDN DE FULLCALENDAR v6 -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/agenda.js"></script>
</body>

</html>
